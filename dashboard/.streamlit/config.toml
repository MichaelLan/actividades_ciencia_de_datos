[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f3"
textColor = "#1f1e1c"
borderColor = "#e4e3dc"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"
metricValueFontSize = "1.85rem"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#f6f6f3"
secondaryBackgroundColor = "#ffffff"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
