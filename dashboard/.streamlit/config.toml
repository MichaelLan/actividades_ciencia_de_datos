[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f6f8fc"
secondaryBackgroundColor = "#eef2f8"
textColor = "#1b2333"
borderColor = "#e3e8f0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.75rem"
buttonRadius = "full"
font = "sans-serif"
headingFontWeights = [750, 700, 700, 650, 600, 600]
metricValueFontSize = "2.3rem"
metricValueFontWeight = 700
redColor = "#e34948"
orangeColor = "#eb6834"
yellowColor = "#d99400"
greenColor = "#1baf7a"
blueColor = "#2a78d6"
violetColor = "#6250d6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6fb"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
