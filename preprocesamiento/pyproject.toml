[tool.pytest.ini_options]
pythonpath = ["."]
tmp_path_retention_policy = "none"

[tool.ruff]
extend-exclude = ["outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[project]
name = "preprocesamiento"
version = "0.1.0"
description = "Reproducible Hotel Booking Demand exploration and baseline preparation"
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
notebook = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
